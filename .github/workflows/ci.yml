name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality
        env:
          QUALITY_LOG_DIR: quality-logs

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-logs
          path: quality-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Set Version
        run: node scripts/set-version.mjs

      - name: Publish Test Report
        uses: dorny/test-reporter@c0efed4aa2e7b2e2ea5ba190e28b07a86790ecdd # v1
        if: success() || failure()
        with:
          name: Node Tests 
          path: test-report.xml
          reporter: java-junit
