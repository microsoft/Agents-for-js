name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate repository structure
        run: npm run repo:doctor

      - name: Lint codebase
        run: npm run lint

      - name: Validate unused dependencies, exports, and files
        run: npm run lint:deps:ci

      - name: Build TS
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run compat
        run: npm run compat

      - name: Build samples
        run: npm run build:samples

      - name: Set Version
        run: node scripts/set-version.mjs

      - name: Publish Test Report
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        if: success() || failure()
        with:
          name: Node Tests 
          path: test-report.xml
          reporter: java-junit
