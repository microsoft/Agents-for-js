name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate repository structure
        run: npm run repo:doctor

      - name: Lint codebase
        run: npm run lint

      - name: Validate unused dependencies, exports, and files
        run: npm run lint:deps:ci

      - name: Build TS
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run compat
        run: npm run compat

      - name: Build samples
        run: npm run build:samples

      - name: Set Version
        run: node scripts/set-version.mjs

      - name: Publish Test Report
        uses: dorny/test-reporter@a53e41438c2381e621dc719a47a57180e30c7075 # v1
        if: success() || failure()
        with:
          name: Node Tests 
          path: test-report.xml
          reporter: java-junit
