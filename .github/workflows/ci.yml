name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality
        env:
          QUALITY_LOG_DIR: quality-logs

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-logs
          path: quality-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Set Version
        run: node scripts/set-version.mjs

      - name: Publish Test Report
        uses: dorny/test-reporter@cc52f364a405169afe07bb00dab3d375b451229d
        if: success() || failure()
        with:
          name: Node Tests 
          path: test-report.xml
          reporter: java-junit
