pr:
- main
- release/*

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Install Node.js'

- script: echo "registry=https://pkgs.dev.azure.com/dynamicscrm/OneCRM/_packaging/DPX-Tools-Upstream/npm/registry/" > .npmrc
  displayName: 'Set NPM registry'

- task: npmAuthenticate@0
  inputs:
    workingFile: .npmrc

- task: Npm@1
  inputs:
    command: custom
    customCommand: 'ci'
    customRegistry: useFeed
    customFeed: OneCRM/DPX-Tools-Upstream
    verbose: true
    workingDir: .
  displayName: 'npm ci'

- script: npm run quality
  displayName: quality checks

- script: node scripts/set-version.mjs
  displayName: set version

- task: PublishTestResults@2
  displayName: 'Publish Unit Test Results'
  condition: succeededOrFailed()
  inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-report.xml'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'Node Tests'
